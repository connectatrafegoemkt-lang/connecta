name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Lint, typecheck, testes unitários e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --passWithNoTests
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder

  isolamento-db:
    name: Isolamento entre tenants (RLS no Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/connecta_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get install -y -q postgresql-client
      - run: scripts/db-reset-local.sh
      - run: npm run test:isolation:db
      - name: Deploy automático travado (deploy/configurar-deploy-automatico.sh)
        run: |
          sudo apt-get install -y -q openssh-server openssh-client
          sudo bash tests/deploy/deploy-automatico.test.sh
      - name: Comando de atualização (deploy/atualizar.sh)
        run: sudo bash tests/deploy/atualizar.test.sh
      - name: Antivírus do servidor (deploy/antivirus.sh)
        run: sudo bash tests/deploy/antivirus.test.sh
      - name: Ferramentas do servidor no deploy (deploy/ferramentas-servidor.sh)
        run: bash tests/deploy/ferramentas-servidor.test.sh
      - name: Atualização automática do banco (deploy/migrar-banco.sh)
        run: bash tests/deploy/migrar-banco.test.sh
        env:
          ADMIN_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres

  isolamento-api:
    name: Isolamento entre tenants (via API Supabase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0
      - run: npm ci
      - name: Sobe Supabase local (aplica as migrations)
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
      - name: Exporta credenciais locais (efêmeras, geradas pelo CLI)
        run: |
          supabase status -o env > /tmp/sb.env
          set -a; . /tmp/sb.env; set +a
          echo "SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_DB_URL=$DB_URL" >> "$GITHUB_ENV"
      - name: Build e start do app Next.js apontando para o Supabase local
        run: |
          export NEXT_PUBLIC_SUPABASE_URL="$SUPABASE_URL" NEXT_PUBLIC_SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
          npm run build
          nohup npx next start -p 3000 > /tmp/next.log 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:3000/login && break; sleep 1; done
          echo "APP_URL=http://127.0.0.1:3000" >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:isolation:api
        env:
          REQUIRE_API_TESTS: "1"
      - name: Smoke do worker do WhatsApp (gera QR real por tenant)
        continue-on-error: true
        run: |
          export WHATSAPP_CREDENTIALS_KEY=$(node -e "console.log(require('crypto').randomBytes(32).toString('base64'))")
          nohup npm run worker > /tmp/worker.log 2>&1 &
          status=0; npx tsx tests/smoke/whatsapp-qr.ts || status=$?
          echo "----- log do worker -----"; tail -60 /tmp/worker.log
          exit $status
      - name: Log do Next.js (em caso de falha)
        if: failure()
        run: tail -100 /tmp/next.log || true

  docker:
    name: Build das imagens Docker (app e worker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build do app
        run: docker build --build-arg NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321 --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=ci -t crm-app .
      - name: Build do worker
        run: docker build -f worker/Dockerfile -t crm-worker .
      - name: App sobe e responde
        run: |
          docker run -d --name app -p 3000:3000 -e NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321 -e NEXT_PUBLIC_SUPABASE_ANON_KEY=ci crm-app
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:3000/login && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/login)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/me)" = "401"
      - name: Worker inicia sem erro de módulo
        run: |
          docker run -d --name worker -e SUPABASE_URL=http://127.0.0.1:1 -e SUPABASE_SERVICE_ROLE_KEY=x -e WHATSAPP_CREDENTIALS_KEY=$(openssl rand -base64 32) crm-worker
          sleep 15; docker logs worker 2>&1 | tail -20
          docker logs worker 2>&1 | grep -q "worker do WhatsApp iniciado"
