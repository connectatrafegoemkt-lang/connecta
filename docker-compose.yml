# CONNECTA CRM em produção (VPS): app + worker do WhatsApp + Caddy (HTTPS).
# Uso na VPS:  docker compose up -d --build
# As variáveis vêm do arquivo .env (que fica SÓ no servidor, nunca no Git).

services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-5.5}
    restart: unless-stopped
    expose: ["3000"]

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      WHATSAPP_CREDENTIALS_KEY: ${WHATSAPP_CREDENTIALS_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-5.5}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    restart: unless-stopped
    # tempo para terminar um envio em andamento antes de desligar (deploy)
    stop_grace_period: 20s

  caddy:
    image: caddy:2
    depends_on: [app]
    environment:
      CRM_DOMAIN: ${CRM_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
